<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- ===== 문서 기본 정보 ===== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다시, 나 | 김지은 포트폴리오</title>

  <!-- ===== Google Fonts: Noto Sans KR 연결 ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- ===== 외부 CSS 파일 연결 ===== -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== 헤더: 사이트 제목과 메뉴 ===== -->
  <header>
    <h1>다시, 나</h1>

    <!-- 내비게이션 메뉴: 각 섹션으로 이동 -->
    <nav>
      <ul>
        <li><a href="#about">소개</a></li>
        <li><a href="#career">경력</a></li>
        <li><a href="#skills">역량</a></li>
        <li><a href="#education">교육·자격</a></li>
        <li><a href="#contact">문의</a></li>
      </ul>
    </nav>
  </header>

  <!-- ===== 메인: 페이지의 핵심 내용 ===== -->
  <main>

    <!-- 1. 소개 섹션 -->
    <section id="about">
      <h2>소개</h2>
      <img src="https://placehold.co/300x300?text=Profile" alt="김지은 프로필 사진" width="300" height="300">
      <h3>김지은</h3>
      <p>10년 경력의 사무행정 전문가, 다시 시작합니다</p>
    </section>

    <!-- 2. 경력 섹션 -->
    <section id="career">
      <h2>경력</h2>
      <ul>
        <li>회사명 / 직무 / 근무 기간</li>
        <li>회사명 / 직무 / 근무 기간</li>
      </ul>
    </section>

    <!-- 3. 역량 섹션 -->
    <section id="skills">
      <h2>역량</h2>
      <ul>
        <li>문서 작성 및 관리</li>
        <li>일정·예산 관리</li>
        <li>업무 프로그램 활용</li>
      </ul>
    </section>

    <!-- 4. 교육·자격 섹션 -->
    <section id="education">
      <h2>교육·자격</h2>
      <ul>
        <li>교육 과정명 / 기관 / 수료 연도</li>
        <li>자격증명 / 발급 기관 / 취득 연도</li>
      </ul>
    </section>

    <!-- 5. 문의 섹션 -->
    <section id="contact">
      <h2>문의</h2>
      <p>이메일: example@email.com</p>
    </section>

  </main>

  <!-- ===== 푸터: 저작권 표시 ===== -->
  <footer>
    <p>&copy; <span id="year"></span> 김지은. All rights reserved.</p>
  </footer>

  <!-- ===== 외부 JavaScript 파일 연결 (본문 끝에 두어 HTML을 먼저 불러옴) ===== -->
  <script src="js/script.js"></script>
</body>
</html>
